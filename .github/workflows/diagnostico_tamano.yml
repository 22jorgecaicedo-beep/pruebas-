name: Diagnóstico de fuentes de tamaño

on:
  push:
    branches: [claude/database-ips-cooperativas-dukd37]
    paths:
      - .github/workflows/diagnostico_tamano.yml

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Revisar capacidad instalada y estados financieros
        run: |
          python - <<'PY'
          import collections, csv, io, json, urllib.parse, urllib.request

          def get(url):
              peticion = urllib.request.Request(url, headers={"User-Agent": "diagnostico"})
              with urllib.request.urlopen(peticion, timeout=600) as respuesta:
                  return respuesta.read()

          def soql(ds, **params):
              q = urllib.parse.urlencode({f"${k}": v for k, v in params.items()})
              return json.loads(get(f"https://www.datos.gov.co/resource/{ds}.json?{q}"))

          for ds in ("s2ru-bqt6", "tic6-rbue"):
              meta = json.loads(get(f"https://www.datos.gov.co/api/views/{ds}.json"))
              print(f"===== {ds}: {meta.get('name')} | filas: {soql(ds, select='count(*)')} "
                    f"| actualizado: {meta.get('rowsUpdatedAt')}")
              for c in meta.get("columns", []):
                  top = [t.get("item") for t in (c.get("cachedContents") or {}).get("top", [])][:12]
                  print(f"   {c.get('fieldName')} | {c.get('name')} | {c.get('dataTypeName')} | top: {top}")
              for fila in soql(ds, limit=3):
                  print("   FILA", fila)

          # Capacidad instalada: grupos, descripciones, fecha de corte, niveles.
          meta = json.loads(get("https://www.datos.gov.co/api/views/s2ru-bqt6.json"))
          campos = [c["fieldName"] for c in meta["columns"]]
          def campo(*claves):
              return next((f for f in campos if any(k in f.lower() for k in claves)), None)
          grupo, desc, cant = campo("grupo"), campo("descrip"), campo("cantidad")
          corte, nivel, depto = campo("corte"), campo("nivel"), campo("depa", "dpto")
          print("campos detectados:", grupo, desc, cant, corte, nivel, depto)
          for f in (corte, nivel, depto, grupo):
              if f:
                  print(f"--- {f}:", soql("s2ru-bqt6", select=f"{f}, count(*)", group=f, order="count(*) DESC", limit=60))
          if grupo and desc and cant:
              print("--- grupo/descripcion:", json.dumps(soql(
                  "s2ru-bqt6", select=f"{grupo}, {desc}, count(*), sum({cant})",
                  group=f"{grupo}, {desc}", order=f"{grupo}", limit=500), ensure_ascii=False))

          # Estados financieros: periodos y cuentas disponibles.
          meta = json.loads(get("https://www.datos.gov.co/api/views/tic6-rbue.json"))
          campos = [c["fieldName"] for c in meta["columns"]]
          for f in campos:
              if any(k in f.lower() for k in ("ano", "año", "mes", "periodo", "corte", "fecha", "cuenta", "codigo", "nombre_c")):
                  try:
                      print(f"--- {f}:", soql("tic6-rbue", select=f"{f}, count(*)", group=f, order="count(*) DESC", limit=40))
                  except Exception as error:
                      print(f"--- {f}: error {error}")
          PY

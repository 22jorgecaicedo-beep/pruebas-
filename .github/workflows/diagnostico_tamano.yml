name: Diagnóstico de fuentes de tamaño

on:
  push:
    branches: [claude/database-ips-cooperativas-dukd37]
    paths:
      - .github/workflows/diagnostico_tamano.yml

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Revisar capacidad instalada y estados financieros
        run: |
          python - <<'PY'
          import collections, csv, io, json, time, urllib.request

          def get(url, limite=None):
              for intento in range(5):
                  try:
                      peticion = urllib.request.Request(url, headers={"User-Agent": "diagnostico"})
                      with urllib.request.urlopen(peticion, timeout=900) as respuesta:
                          return respuesta.read(limite) if limite else respuesta.read()
                  except Exception as error:
                      print(f"   reintento {intento + 1} de {url}: {error}")
                      time.sleep(10 * (intento + 1))
              raise RuntimeError(url)

          for ds in ("s2ru-bqt6", "tic6-rbue"):
              meta = json.loads(get(f"https://www.datos.gov.co/api/views/{ds}.json"))
              print(f"===== {ds}: {meta.get('name')} | actualizado: {meta.get('rowsUpdatedAt')} "
                    f"| tipo: {meta.get('viewType')}/{meta.get('displayType')}")
              for c in meta.get("columns", []):
                  cc = c.get("cachedContents") or {}
                  top = [t.get("item") for t in cc.get("top", [])][:15]
                  print(f"   {c.get('fieldName')} | {c.get('name')} | {c.get('dataTypeName')} "
                        f"| no nulos: {cc.get('non_null')} | top: {top}")

          # Capacidad instalada: archivo completo.
          datos = get("https://www.datos.gov.co/api/views/s2ru-bqt6/rows.csv?accessType=DOWNLOAD")
          filas = list(csv.reader(io.StringIO(datos.decode("utf-8-sig"))))
          encabezados, filas = filas[0], filas[1:]
          print(f"===== s2ru CSV: {len(datos) / 2**20:.1f} MB, {len(filas)} filas")
          print("encabezados:", encabezados)
          for fila in filas[:3]:
              print("   FILA", fila)
          def col(*claves):
              return next((i for i, h in enumerate(encabezados) if any(k in h.lower() for k in claves)), None)
          for nombre, i in (("corte", col("corte")), ("nivel", col("nivel")), ("depto", col("depa", "dpto")),
                            ("naturaleza", col("natur")), ("fuente", col("fuente"))):
              if i is not None:
                  print(f"--- {nombre} ({encabezados[i]}):", collections.Counter(f[i] for f in filas).most_common(40))
          g, d, q = col("grupo"), col("descrip"), col("cantidad", "numero_cant", "número cant")
          print("grupo/desc/cantidad:", g, d, q)
          if g is not None and d is not None:
              suma = collections.defaultdict(lambda: [0, 0.0])
              for f in filas:
                  suma[(f[g], f[d])][0] += 1
                  try:
                      suma[(f[g], f[d])][1] += float(f[q]) if q is not None else 0
                  except ValueError:
                      pass
              for (grupo, desc), (n, total) in sorted(suma.items()):
                  print(f"   {grupo} | {desc} | filas {n} | total {total:.0f}")
          nit = col("nit")
          if nit is not None:
              print("NIT distintos:", len({f[nit] for f in filas}))

          # Estados financieros: solo el comienzo del archivo.
          inicio = get("https://www.datos.gov.co/api/views/tic6-rbue/rows.csv?accessType=DOWNLOAD", 3_000_000)
          lineas = list(csv.reader(io.StringIO(inicio.decode("utf-8-sig", "ignore"))))[:-1]
          print(f"===== tic6 CSV (primeros {len(lineas)} renglones)")
          print("encabezados:", lineas[0])
          for fila in lineas[1:6]:
              print("   FILA", fila)
          for i, h in enumerate(lineas[0]):
              valores = collections.Counter(f[i] for f in lineas[1:] if len(f) > i)
              if len(valores) < 60:
                  print(f"--- {h}:", valores.most_common(30))
          PY

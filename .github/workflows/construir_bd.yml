name: Construir base de datos de IPS y cooperativas

on:
  workflow_dispatch:
  push:
    branches: [claude/database-ips-cooperativas-dukd37]
    paths:
      - base_datos_ips_cooperativas/construir_bd.py
      - .github/workflows/construir_bd.yml

jobs:
  construir:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r base_datos_ips_cooperativas/requirements.txt

      - name: Construir la base de datos
        working-directory: base_datos_ips_cooperativas
        run: python construir_bd.py

      - name: Guardar el resultado en la rama
        run: |
          # La rama pudo avanzar mientras el job esperaba; guarda el resultado
          # sobre su ultima version.
          git fetch origin "$GITHUB_REF_NAME"
          git checkout -B "$GITHUB_REF_NAME" "origin/$GITHUB_REF_NAME"
          destino=base_datos_ips_cooperativas/resultado
          rm -rf "$destino"
          mkdir -p "$destino"
          cp -r base_datos_ips_cooperativas/salida/IPS_y_Cooperativas.xlsx \
                base_datos_ips_cooperativas/salida/Correos_IPS.xlsx \
                base_datos_ips_cooperativas/salida/Ranking_IPS.xlsx \
                base_datos_ips_cooperativas/salida/ips_cooperativas.sqlite \
                base_datos_ips_cooperativas/salida/csv "$destino"/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$destino"
          if git diff --cached --quiet; then
            echo "Sin cambios en el resultado."
          else
            git commit -m "Actualizar base de datos de IPS y cooperativas ($(date -u +%Y-%m-%d))"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

name: Construir base de datos de IPS y cooperativas

on:
  workflow_dispatch:
  push:
    branches: [claude/database-ips-cooperativas-dukd37]
    paths:
      - base_datos_ips_cooperativas/construir_bd.py
      - .github/workflows/construir_bd.yml

jobs:
  construir:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r base_datos_ips_cooperativas/requirements.txt

      - name: Construir la base de datos
        working-directory: base_datos_ips_cooperativas
        run: python construir_bd.py

      - name: Construir la base de datos de Bogotá y Boyacá
        working-directory: base_datos_ips_cooperativas
        # Usa los registros que acaba de descargar el paso anterior.
        run: >-
          python construir_bd.py --departamentos "Bogotá, Boyacá"
          --salida salida_bogota_boyaca
          --archivo-reps salida/fuentes/reps_c36g-9fc2.csv
          --archivo-solidarias salida/fuentes/solidarias_kg2d-yfyg.csv
          --archivo-capacidad salida/fuentes/capacidad_s2ru-bqt6.csv

      - name: Guardar el resultado en la rama
        run: |
          # La rama pudo avanzar mientras el job esperaba; guarda el resultado
          # sobre su ultima version.
          git fetch origin "$GITHUB_REF_NAME"
          git checkout -B "$GITHUB_REF_NAME" "origin/$GITHUB_REF_NAME"
          for par in salida:resultado salida_bogota_boyaca:resultado_bogota_boyaca; do
            origen=base_datos_ips_cooperativas/${par%%:*}
            destino=base_datos_ips_cooperativas/${par##*:}
            rm -rf "$destino"
            mkdir -p "$destino"
            cp -r "$origen"/IPS_y_Cooperativas.xlsx "$origen"/Correos_IPS.xlsx \
                  "$origen"/Ranking_IPS.xlsx "$origen"/ips_cooperativas.sqlite \
                  "$origen"/csv "$destino"/
            git add "$destino"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "Sin cambios en el resultado."
          else
            git commit -m "Actualizar base de datos de IPS y cooperativas ($(date -u +%Y-%m-%d))"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
